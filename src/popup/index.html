<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZentyRecon Popup</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #020817;
      color: #f1f5f9;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: white;
      box-shadow: 0 0 14px rgba(124, 58, 237, 0.45);
    }
    .title-group {
      flex: 1;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .domain-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .domain-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .domain-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }
    .action-btn:hover {
      opacity: 0.92;
    }
    .footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ZR</div>
    <div class="title-group">
      <div class="title">ZentyRecon</div>
      <span class="badge">Community</span>
    </div>
  </div>

  <div class="domain-box">
    <div class="domain-label">Active Target</div>
    <div class="domain-val" id="active-domain">Detecting...</div>
  </div>

  <button class="action-btn" id="btn-open-panel">
    <span>Open Recon Side Panel</span>
    <span>→</span>
  </button>

  <div class="footer">
    <span>PQC Security Suite</span>
    <span>v0.1.0</span>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
